<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="베이커리 트윈">
  <title>🏭 베이커리 공장 디지털 트윈 - 전체 공정 시뮬레이션</title>
  <style>
    /* ===== DARK THEME VARIABLES ===== */
    :root {
      --bg: #0a0e1a;
      --bg2: #0f1525;
      --surface: #151d32;
      --surface2: #1b2540;
      --surface3: #222d4a;
      --border: #2a3658;
      --border2: #3a4a70;
      --text: #e8ecf5;
      --text2: #a0aac5;
      --text3: #6a7a9a;
      --accent: #f0a050;
      --accent2: #ff8533;
      --accent-glow: rgba(240, 160, 80, 0.3);
      --blue: #5b9aff;
      --blue-glow: rgba(91, 154, 255, 0.25);
      --green: #45d98c;
      --green-glow: rgba(69, 217, 140, 0.2);
      --red: #ff6b6b;
      --red-glow: rgba(255, 107, 107, 0.2);
      --purple: #b07aff;
      --purple-glow: rgba(176, 122, 255, 0.2);
      --cyan: #5ce0d6;
      --yellow: #ffd75e;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg2);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 3px;
    }

    /* ===== TOP NAV BAR ===== */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      background: linear-gradient(135deg, #0d1220 0%, #141e35 100%);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }

    #navbar .logo {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #navbar .logo span {
      font-size: 20px;
    }

    .nav-btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      background: var(--surface3);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .nav-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #1a1000;
      border-color: var(--accent);
      font-weight: 700;
    }

    .nav-btn.primary:hover {
      box-shadow: 0 4px 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    #slideCounter {
      font-size: 13px;
      color: var(--text2);
      min-width: 70px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ===== PROGRESS BAR ===== */
    #progressBar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      z-index: 100;
      transition: width 0.4s ease;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ===== SLIDE DECK ===== */
    #deck {
      position: absolute;
      top: 56px;
      bottom: 4px;
      left: 0;
      right: 0;
    }

    .slide {
      display: none;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 30px 5vw 50px;
    }

    .slide.active {
      display: block;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 5px var(--accent-glow);
      }

      50% {
        box-shadow: 0 0 20px var(--accent-glow);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    @keyframes waveMove {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    @keyframes conveyorMove {
      0% {
        stroke-dashoffset: 0;
      }

      100% {
        stroke-dashoffset: -30;
      }
    }

    @keyframes bubbleRise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.7;
      }

      100% {
        transform: translateY(-60px) scale(0.3);
        opacity: 0;
      }
    }

    @keyframes heatWave {

      0%,
      100% {
        transform: scaleY(1) translateY(0);
        opacity: 0.5;
      }

      50% {
        transform: scaleY(1.3) translateY(-5px);
        opacity: 0.8;
      }
    }

    @keyframes countUp {
      from {
        opacity: 0;
        transform: scale(0.5);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== CARDS & HIGHLIGHTS ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px var(--accent-glow), 0 0 0 1px var(--accent-glow);
      background: var(--surface2);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-blue:hover {
      border-color: var(--blue);
      box-shadow: 0 8px 30px var(--blue-glow);
    }

    .card-blue:hover::before {
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
    }

    .card-green:hover {
      border-color: var(--green);
      box-shadow: 0 8px 30px var(--green-glow);
    }

    .card-green:hover::before {
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }

    .card-purple:hover {
      border-color: var(--purple);
      box-shadow: 0 8px 30px var(--purple-glow);
    }

    .card-purple:hover::before {
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
    }

    .card-red:hover {
      border-color: var(--red);
      box-shadow: 0 8px 30px var(--red-glow);
    }

    /* ===== COVER SLIDE ===== */
    .cover {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100%;
      max-width: 1000px;
    }

    .cover .tag {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.15em;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .cover h1 {
      font-size: 44px;
      line-height: 1.2;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover .subtitle {
      font-size: 17px;
      color: var(--text2);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    /* ===== GRID LAYOUTS ===== */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .process-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    /* ===== TYPOGRAPHY ===== */
    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--text);
    }

    h3 {
      font-size: 15px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    p {
      color: var(--text2);
      line-height: 1.7;
      font-size: 14.5px;
      margin-bottom: 10px;
    }

    /* ===== BADGES & CHIPS ===== */
    .badge {
      display: inline-block;
      font-weight: 800;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid;
    }

    .chip-safety {
      color: var(--red);
      border-color: rgba(255, 107, 107, 0.4);
      background: rgba(255, 107, 107, 0.1);
    }

    .chip-quality {
      color: var(--blue);
      border-color: rgba(91, 154, 255, 0.4);
      background: rgba(91, 154, 255, 0.1);
    }

    /* ===== GROUP HEADERS ===== */
    .group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 12px;
    }

    .group-tag {
      font-weight: 800;
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 8px;
      color: #0a0e1a;
      letter-spacing: 0.05em;
    }

    .group-label {
      font-weight: 700;
      font-size: 16px;
    }

    /* ===== PROCESS SLIDE LAYOUTS ===== */
    .process-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .process-right {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ===== ILLUSTRATION BOX ===== */
    .illust-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .illust-box svg,
    .illust-box canvas {
      width: 100%;
      display: block;
    }

    .illust-caption {
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text3);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== SIMULATION BOX ===== */
    .sim-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .sim-box canvas {
      width: 100%;
      height: 200px;
      display: block;
    }

    .sim-label {
      position: absolute;
      top: 10px;
      left: 12px;
      background: rgba(10, 14, 26, 0.85);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sim-label::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s infinite;
    }

    .sim-controls {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sim-btn {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: var(--transition);
    }

    .sim-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .sim-btn.active {
      background: var(--accent);
      color: #1a1000;
      border-color: var(--accent);
    }

    .sim-speed {
      font-size: 11px;
      color: var(--text3);
      margin-left: auto;
    }

    /* ===== DYNAMIC CHART ===== */
    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative;
    }

    .chart-box canvas {
      width: 100%;
      height: 180px;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-legend {
      display: flex;
      gap: 14px;
      margin-top: 8px;
    }

    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text2);
    }

    .chart-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* ===== SENSOR TABLE ===== */
    .sensor-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .sensor-table th {
      background: var(--surface3);
      padding: 8px 12px;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .sensor-table td {
      padding: 8px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      transition: var(--transition);
    }

    .sensor-table tr:hover td {
      background: var(--surface2);
    }

    .sensor-table .val-normal {
      color: var(--green);
      font-weight: 700;
    }

    .sensor-table .val-warning {
      color: var(--yellow);
      font-weight: 700;
    }

    .sensor-table .val-critical {
      color: var(--red);
      font-weight: 700;
    }

    /* ===== INFO BOXES ===== */
    .info-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      transition: var(--transition);
    }

    .info-box:hover {
      border-color: var(--border2);
      background: var(--surface2);
    }

    .info-box h3 {
      margin-bottom: 6px;
    }

    .info-box p,
    .info-box span {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
    }

    /* ===== TERM TOOLTIP TRIGGERS ===== */
    .term {
      color: var(--accent);
      border-bottom: 1px dashed var(--accent);
      cursor: help;
      transition: var(--transition);
      position: relative;
    }

    .term:hover {
      background: rgba(240, 160, 80, 0.15);
      border-radius: 3px;
      padding: 0 2px;
    }

    /* ===== FLOATING TOOLTIP ===== */
    #tooltip {
      position: fixed;
      z-index: 200;
      max-width: 320px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #141e35, #1b2845);
      border: 1px solid var(--accent);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
      pointer-events: none;
      display: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--accent-glow);
      backdrop-filter: blur(10px);
    }

    #tooltip::before {
      content: '💡';
      position: absolute;
      top: -10px;
      left: 12px;
      background: var(--bg2);
      border-radius: 50%;
      padding: 0 3px;
      font-size: 14px;
    }

    /* ===== MODAL / POPUP ===== */
    #modalBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    #modalBackdrop.active {
      display: flex;
    }

    #modalContent {
      background: linear-gradient(180deg, var(--surface), var(--bg2));
      border: 1px solid var(--border2);
      border-radius: 20px;
      max-width: 680px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    #modalContent h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    #modalContent p {
      margin-bottom: 10px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      color: var(--text2);
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--red);
      color: white;
      border-color: var(--red);
    }

    /* ===== EXPLANATION POPUP ===== */
    .explain-popup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 150;
      background: linear-gradient(135deg, #1a2540, #1e2f50);
      border: 1px solid var(--blue);
      border-radius: 16px;
      padding: 18px 22px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--blue-glow);
      transform: translateY(calc(100% + 40px));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(10px);
    }

    .explain-popup.show {
      transform: translateY(0);
    }

    .explain-popup h4 {
      color: var(--blue);
      font-size: 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .explain-popup p {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
      margin: 0;
    }

    .explain-popup .close-explain {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 16px;
    }

    /* ===== RETURN POPUP (BREADCRUMB) ===== */
    .return-popup {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-200px);
      z-index: 150;
      background: linear-gradient(135deg, #1a2040, #252f50);
      border: 1px solid var(--green);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 15px var(--green-glow);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(10px);
      font-size: 13px;
    }

    .return-popup.show {
      transform: translateX(-50%) translateY(0);
    }

    .return-popup button {
      background: var(--green);
      color: #0a1a10;
      border: none;
      border-radius: 8px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .return-popup button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px var(--green-glow);
    }

    /* ===== QUIZ OPTIONS ===== */
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      margin: 8px 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      position: relative;
    }

    .quiz-option:hover {
      border-color: var(--accent);
      background: var(--surface3);
      transform: translateX(4px);
    }

    .quiz-option.correct {
      border-color: var(--green);
      background: rgba(69, 217, 140, 0.12);
    }

    .quiz-option.wrong {
      border-color: var(--red);
      background: rgba(255, 107, 107, 0.12);
    }

    .quiz-result {
      padding: 14px 18px;
      border-radius: 12px;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .quiz-result.pass {
      background: rgba(69, 217, 140, 0.1);
      border: 1px solid var(--green);
    }

    .quiz-result.fail {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid var(--red);
    }

    /* ===== STEP INDICATOR ===== */
    .step-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin: 16px 0;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      transition: var(--transition);
      cursor: pointer;
    }

    .step-dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      transform: scale(1.3);
    }

    .step-dot:hover {
      background: var(--accent);
      transform: scale(1.2);
    }

    /* ===== PROCESS CARD (MAP VIEW) ===== */
    .pcard {
      text-align: center;
    }

    .pcard .pcard-num {
      font-size: 11px;
      color: var(--text3);
      margin-bottom: 4px;
    }

    .pcard .pcard-icon {
      font-size: 36px;
      margin-bottom: 6px;
      transition: transform 0.3s;
    }

    .pcard:hover .pcard-icon {

      animation: float 2s ease infinite;
    }

      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pcard .pcard-desc {

      color: var(--text3);
      line-height: 1.4;
    }

      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }

    /* ===== RESPONSIVE ===== */
    /* ===== INVESTMENT PRE-CHECK ===== */

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }

      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12.5px;
      color: var(--text2);
    }

    .inv-field em {
      font-style: normal;
      font-size: 11px;
      color: var(--text3);
    }

    .inv-field input,
    .inv-field select {
      width: 100%;
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 15px;
      font-family: inherit;
    }

    .inv-field input:focus,
    .inv-field select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .inv-field input.bad {
      border-color: var(--red);
    }

    .inv-wide {
      grid-column: 1 / -1;
    }

    .inv-kpi {
      text-align: center;
    }

    .inv-kpi b {
      display: block;
      font-size: 21px;
      font-weight: 800;
    }

    .inv-photo-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .inv-photo {
      width: 96px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border2);
    }

    /* ===== LINE SIMULATOR ===== */
    .line-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 12px 0;
    }

    .line-box canvas {
      display: block;
      width: 100%;
      height: 500px;
      cursor: pointer;
    }

    @media(max-width:600px) {
      .line-box canvas {
        height: 360px;
      }
    }

    @media(max-width:1024px) {
      .process-grid {
        grid-template-columns: 1fr;
      }

      .grid-4 {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width:768px) {

      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .cover h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 22px;
      }
    }

        gap: 6px;
      }

      #navbar .logo {
        font-size: 0;
      }

      #navbar .logo span {
        font-size: 22px;
      }

      .nav-btn {
        padding: 8px 9px;
        font-size: 12px;
      }

        font-size: 12px;
      }

      }

      .cover h1 {
        font-size: 26px;
      }

      .cover .subtitle {
        font-size: 14.5px;
      }

        font-size: 20px;
      }

      .grid-4 {
        gap: 10px;
      }

      .card {
        padding: 14px 10px;
      }

      .step-dots {
        gap: 5px;
      }

      .step-dot {
        width: 9px;
        height: 9px;
      }

      .sim-controls {
        flex-wrap: wrap;
      }

      .sim-btn {
        padding: 8px 11px;
        font-size: 12px;
      }

      .sim-speed {
        width: 100%;
        margin-left: 0;
      }

        font-size: 11.5px;
      }

      .sensor-table th,
      .sensor-table td {
        padding: 7px 4px;
      }

      .chart-row {
        flex-direction: column;
        align-items: stretch !important;
      }

      .chart-row .gauge-container {
        flex: 0 0 auto !important;
      }

      }

      }

      .explain-popup {
        left: 10px;
        right: 10px;
        bottom: 12px;
        width: auto;
        max-width: none;
      }

      .return-popup {

        gap: 8px;

      }

        padding: 10px;
      }

      #modalContent {
        padding: 22px 16px;
      }

      #modalContent h2 {

        padding-right: 44px;
      }
    }
  </style>
</head>

      ctx.clearRect(0, 0, w, h);

      for (k = 0; k < n; k++) {

    function invCalc(k) {
      var v = inv.v, caps = inv.caps, t0 = Infinity, t1 = Infinity, b0 = 0, b1 = 0, i, c, items, net = 0, cost = v.cost * 1e6;
      for (i = 0; i < caps.length; i++) {
        if (caps[i] < t0) { t0 = caps[i]; b0 = i; }
        c = i === inv.proc ? v.cap1 : caps[i];

      }
      items = [
        // 늘어난 양품 중 팔 수 있는 만큼만 이익으로 본다 (줄어드는 경우는 전량 손실)
        (t1 - t0) * v.hours * (1 - v.d1 / 100) * (t1 > t0 ? v.sell / 100 : 1) * v.margin,
        // 불량 감소는 보수적으로 버려지던 재료비만 절감으로 본다
        Math.min(t0, t1) * v.hours * (v.d0 - v.d1) / 100 * v.mat,

        (v.e0 - v.e1) * v.hours,
        -v.maint * 1e6

        payback: net >= 1 ? Math.round(cost / net * 10) / 10 : Infinity,

    function drawInvCap(a) {
      var f = fitCanvas($('inv-cap'));
      if (!f) return;

      for (i = 0; i < n; i++) max = Math.max(max, caps[i]);
      max = max * 1.1 || 1;
      function Y(v) { return pt + (1 - v / max) * (h - pt - pb); }
      function bar(x0, bwid, v, col) { ctx.fillStyle = col; ctx.fillRect(x0, Y(v), bwid, h - pb - Y(v)); }
      ctx.clearRect(0, 0, w, h);
      ctx.font = '10px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (i = 0; i < n; i++) {
        x = pl + i * bw;
        if (i === inv.proc) {
          bar(x + bw * 0.08, bw * 0.38, caps[i], '#6a7a9a');
          bar(x + bw * 0.54, bw * 0.38, inv.v.cap1, i === a.b1 ? '#ff6b6b' : '#f0a050');
        } else {
          bar(x + bw * 0.15, bw * 0.7, caps[i], i === a.b1 ? '#ff6b6b' : '#3a4a70');
        }
        ctx.fillStyle = i === inv.proc ? '#f0a050' : '#6a7a9a';
        ctx.fillText(i + 1, x + bw / 2, h - pb + 5);
      }
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
      [[a.t0, '#a0aac5'], [a.t1, '#45d98c']].forEach(function (l, k) {
        if (k === 0 && Math.abs(Y(a.t0) - Y(a.t1)) < 12) return; // 두 선이 겹치면 투자 후 선만 표시
        ctx.strokeStyle = ctx.fillStyle = l[1];
        ctx.beginPath(); ctx.moveTo(pl, Y(l[0])); ctx.lineTo(w - pr, Y(l[0])); ctx.stroke();

    function drawInvCash(now) {
      var f = fitCanvas($('inv-cash'));

      invRes.forEach(function (r) { lo = Math.min(lo, -r.cost, r.net * L - r.cost); hi = Math.max(hi, r.net * L - r.cost); });
      if (hi - lo < 1) hi = lo + 1;

      function Y(v) { return pt + (1 - (v - lo) / (hi - lo)) * (h - pt - pb); }

      ctx.strokeStyle = '#3a4a70'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pl, Y(0)); ctx.lineTo(w - pr, Y(0)); ctx.stroke();
      ctx.fillStyle = '#6a7a9a'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (t = 0; t <= L; t += step) ctx.fillText(t + '년', X(t), h - pb + 5);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      [lo, 0, hi].forEach(function (v, k) {
        if (k !== 1 && Math.abs(Y(v) - Y(0)) < 12) return;
        ctx.fillText(k === 1 ? '0' : fmtWon(v), pl - 5, Y(v));

    }

    function openModal(html) {
      $('modalContent').innerHTML = '<button class="modal-close" data-act="closeModal">✕</button>' + html;
      $('modalBackdrop').classList.add('active');
      $('tooltip').style.display = 'none';
    }

    function closeModal() { $('modalBackdrop').classList.remove('active'); }

    function openQuiz(i) {
      var p = PROCESSES[i], k, html = '<h2>🚨 이상 상황 대응 훈련</h2><div class="badge" style="background:' + GRP[p[0]][1] + ';color:#0a0e1a">' +
        p[2] + ' ' + p[1] + '</div><p>' + withTerms(p[11]) + '</p><p style="color:var(--text)"><b>어떻게 조치해야 할까요?</b></p>';
      for (k = 0; k < 3; k++) {
        html += '<button class="quiz-option" data-ans="' + k + '" data-p="' + i + '">' + (k + 1) + '. ' + esc(p[12 + k]) + '</button>';
      }
      openModal(html + '<div id="quizResult"></div>');
    }

    function answerQuiz(btn) {
      var i = +btn.getAttribute('data-p'), k = +btn.getAttribute('data-ans'), p = PROCESSES[i], res = $('quizResult');
      if (k === p[15]) {
        btn.classList.add('correct');
        Array.prototype.forEach.call(document.querySelectorAll('#modalContent .quiz-option'), function (b) { b.disabled = true; });
        state[i].solved = true;
        setScenario(i, 0);
        res.className = 'quiz-result pass';
        res.innerHTML = '<b>✔ 정답입니다.</b> ' + withTerms(p[16]) + '<br><span style="color:var(--text3)">공정이 정상 상태로 복구됩니다.</span>';
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        res.className = 'quiz-result fail';
        res.innerHTML = '<b>✘ 올바른 조치가 아닙니다.</b> 안전과 제품 식별·격리 관점에서 다시 생각해 보세요.';
      }
      updateUI();
    }

    function openGlossary() {
      openModal('<h2>📖 용어 사전</h2>' + Object.keys(GLOSSARY).map(function (t) {
        return '<div class="info-box" style="margin-bottom:8px"><h3 style="color:var(--accent)">' + t + '</h3><p style="margin:0">' + esc(GLOSSARY[t]) + '</p></div>';
      }).join(''));
    }

    /* ===== EVENTS ===== */
    document.addEventListener('click', function (e) {
      if (e.target === $('modalBackdrop')) { closeModal(); return; }
      var t = e.target.closest('[data-go],[data-sc],[data-quiz],[data-act],[data-et],[data-ans]'), act, i;
      if (!t) return;
      if (t.hasAttribute('data-ans')) { answerQuiz(t); return; }
      if (t.hasAttribute('data-go')) { go(+t.getAttribute('data-go'), !t.hasAttribute('data-nr')); return; }
      if (t.hasAttribute('data-sc')) { setScenario(+t.getAttribute('data-p'), +t.getAttribute('data-sc')); updateUI(); return; }
      if (t.hasAttribute('data-quiz')) { openQuiz(+t.getAttribute('data-quiz')); return; }
      if (t.hasAttribute('data-et')) { showExplain(t.getAttribute('data-et'), t.getAttribute('data-ex')); return; }
      act = t.getAttribute('data-act');
      if (act === 'pause') paused = !paused;
      else if (act === 'speed') speedIdx = (speedIdx + 1) % SPEEDS.length;
      else if (act === 'closeModal') closeModal();
      else if (act === 'glossary') openGlossary();
      else if (act === 'resetAll') state.forEach(function (s, k) { setScenario(k, 0); });
      else if (act.indexOf('invSc') === 0) { inv.sc = +act.slice(5); invSave(); }
      else if (act === 'invHelp') openInvHelp();
      else if (act === 'invReset') {
        // WebView 에서는 confirm() 대화상자가 뜨지 않으므로 모달로 확인받는다
        openModal('<h2>↺ 예시 값으로 초기화</h2><p>입력한 값을 모두 지우고 처음의 예시 값으로 되돌립니다.</p>' +
          '<div style="display:flex;gap:8px"><button class="nav-btn primary" data-act="invResetYes">초기화</button><button class="nav-btn" data-act="closeModal">취소</button></div>');
      } else if (act === 'invResetYes') { invDefaults(); invFill(); invSave(); lsReset(); closeModal(); }
      else if (act === 'invPhoto') $('inv-file').click();
      else if (act === 'invPhotoDel') {
        openModal('<h2>🗑 사진 삭제</h2><p>이 공정에 첨부한 장비 사진을 삭제합니다.</p>' +
          '<div style="display:flex;gap:8px"><button class="nav-btn primary" data-act="invPhotoDelYes">삭제</button><button class="nav-btn" data-act="closeModal">취소</button></div>');
      } else if (act === 'invPhotoDelYes') { delete photos[inv.proc]; delete photoImg[inv.proc]; photoSave(); invPhotoShow(); closeModal(); }
      else if (act.indexOf('lsMode') === 0) { ls.mode = +act.slice(6); lsReset(); }
      else if (act === 'lsRun') ls.run = !ls.run;
      else if (act === 'lsSpeed') ls.sp = (ls.sp + 1) % LS_SPEEDS.length;
      else if (act === 'lsReset') lsReset();
      else if (act === 'random') {
        i = Math.floor(Math.random() * PROCESSES.length);
        setScenario(i, Math.random() < 0.5 ? 1 : 2);
        showExplain('이상 발생', (i + 1) + '. ' + PROCESSES[i][1] + ' 공정의 ' + PROCESSES[i][7] + ' 값이 변하고 있습니다. 타일을 눌러 확인하세요.');
      }
      updateUI();
    });

    $('btnPrev').addEventListener('click', function () { go(cur - 1); });
    $('btnNext').addEventListener('click', function () { go(cur + 1); });
    $('btnMap').addEventListener('click', function () { go(2, true); });
    $('btnFullscreen').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    });
    // iPhone Safari는 전체화면 API가 없어 버튼이 동작하지 않으므로 숨긴다 (홈 화면 앱은 이미 전체화면)
    if (!document.documentElement.requestFullscreen) $('btnFullscreen').style.display = 'none';
    $('closeExplain').addEventListener('click', function () { $('explainPopup').classList.remove('show'); });
    $('returnBtn').addEventListener('click', function () { var t = returnTo; hideReturn(); go(t); });
    $('returnClose').addEventListener('click', hideReturn);

    function onInvInput(e) {
      if (e.target.getAttribute && e.target.getAttribute('data-inv')) invInput(e.target);
    }
    document.addEventListener('input', onInvInput);
    document.addEventListener('change', onInvInput);
    document.addEventListener('change', function (e) {
      if (e.target.id !== 'inv-file') return;
      photoPick(e.target.files && e.target.files[0]);
      e.target.value = ''; // 같은 파일을 다시 골라도 change 가 발생하도록 비운다
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeModal(); return; }
      if ($('modalBackdrop').classList.contains('active')) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return; // 입력 중 방향키로 슬라이드가 넘어가지 않게 한다
      if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
      else if (e.key === 'Home') go(0);
      else if (e.key === 'End') go(TOTAL - 1);
    });

    // 용어 툴팁 (모달 위에서도 보이도록 z-index를 모달보다 높임)
    var tip = $('tooltip');
    tip.style.zIndex = 400;
    document.addEventListener('mouseover', function (e) {
      var t = e.target.closest ? e.target.closest('.term') : null;
      if (!t) return;
      tip.innerHTML = '<b style="color:var(--accent)">' + esc(t.getAttribute('data-term')) + '</b><br>' + esc(GLOSSARY[t.getAttribute('data-term')] || '');
      tip.style.display = 'block';
    });
    document.addEventListener('mousemove', function (e) {
      if (tip.style.display !== 'block') return;
      var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 10);
      var y = e.clientY + 22;
      if (y + tip.offsetHeight > window.innerHeight - 10) y = e.clientY - tip.offsetHeight - 14;
      tip.style.left = Math.max(10, x) + 'px';
      tip.style.top = Math.max(10, y) + 'px';
    });
    document.addEventListener('mouseout', function (e) {
      if (e.target.closest && e.target.closest('.term')) tip.style.display = 'none';
    });

    /* ===== BOOT ===== */
    (function boot() {
      var html = [coverSlide(), conceptSlide(), mapSlide()];
      PROCESSES.forEach(function (p, i) { html.push(processSlide(i)); });
      html.push(dashSlide(), investSlide(), lineSlide(), lastSlide());
      $('deck').innerHTML = html.map(function (h) { return '<section class="slide">' + h + '</section>'; }).join('');
      slideEls = Array.prototype.slice.call(document.querySelectorAll('#deck .slide'));
      invLoad();
      photoLoad();
      invFill();
      lsReset();
      // 시뮬레이터에서 설비를 누르면 상세 패널의 대상을 바꾼다
      $('line-cv').addEventListener('click', function (e) {
        if (!lsGeo) return;
        var r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, best = -1, bd = lsGeo.tw * 0.3, k, d;
        for (k = 0; k < lsGeo.pos.length; k++) {
          d = Math.sqrt(Math.pow(lsGeo.pos[k].x - x, 2) + Math.pow(lsGeo.pos[k].y - lsGeo.hg / 2 - y, 2));
          if (d < bd) { bd = d; best = k; }
        }
        if (best >= 0) { ls.sel = best; renderLinePanel(); }
      });
      go(0);

      setInterval(function () {
        if (paused) return;
        for (var k = 0; k < SPEEDS[speedIdx]; k++) stepSim();
        updateUI();
      }, TICK_MS);

      var last = performance.now();
      (function frame(now) {
        var dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
        if (!paused) simClock += dt * SPEEDS[speedIdx];
        last = now;
        if (cur >= P0 && cur < DASH) drawSim(cur - P0, now);
        else if (cur === INVEST) drawInvCash(now);
        else if (cur === LINE) {
          // 그리기 오류 하나로 전체 애니메이션 루프가 멈추지 않도록 격리한다
          try {
            lsAdvance(dt);
            drawLine(now);
            // 수치 패널은 읽기 쉽게 초당 4회만 갱신 (공정 화면의 일시정지와 무관하게 동작)
            if (now - ls.panelT > 250) { ls.panelT = now; renderLinePanel(); }
          } catch (err) {
            console.warn('라인 시뮬레이터 오류:', err);
          }
        }
        requestAnimationFrame(frame);
      })(last);
      window.addEventListener('resize', updateUI);

      // 터치: 좌우 스와이프로 슬라이드 이동 (세로 스크롤과 구분하기 위해 가로 이동이 뚜렷할 때만)
      var SWIPE_MIN = 60, sx = 0, sy = 0;
      $('deck').addEventListener('touchstart', function (e) {
        sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY;
      }, { passive: true });
      $('deck').addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 2) return;
        if (e.target.closest && e.target.closest('input,select,textarea,#line-cv')) return; // 입력칸·라인 시뮬레이터 위에서 끄는 동작은 이동으로 보지 않는다
        go(cur + (dx < 0 ? 1 : -1));
      }, { passive: true });

      // PWA: 오프라인 실행용 서비스 워커 (file:// 로 열면 등록 불가이므로 건너뜀)
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('서비스 워커 등록 실패:', err);
        });
      }
    })();
  </script>
</body>

</html>
